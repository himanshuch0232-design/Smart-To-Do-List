<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Smart To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 50%, #e0f2fe 100%); }
        .dark .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); }
        .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.4); }
        .dark .glass { background: rgba(30,41,59,0.85); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4 text-slate-800 dark:text-slate-100">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 mb-6">
                <div class="w-10 h-10 rounded-xl bg-primary-600 flex items-center justify-center shadow-lg shadow-primary-500/30">
                    <i class="fas fa-check-double text-white"></i>
                </div>
                <span class="font-bold text-2xl">Smart<span class="text-primary-600">ToDo</span></span>
            </a>
            <h1 class="text-2xl font-bold">Reset your password</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-1">Enter your email and we'll help you recover access</p>
        </div>

        <div class="glass rounded-2xl p-8 shadow-xl">
            <form id="forgot-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium mb-1.5">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="email" id="email" required placeholder="you@example.com"
                            class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all">
                    </div>
                </div>
                <div id="msg" class="hidden text-sm px-4 py-2.5 rounded-lg"></div>
                <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-primary-500/25 transition-all">
                    Send Reset Link
                </button>
            </form>
            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
                Remember your password? <a href="login.html" class="text-primary-600 hover:text-primary-700 font-semibold">Sign in</a>
            </p>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">
            <a href="index.html" class="hover:text-primary-600"><i class="fas fa-arrow-left mr-1"></i> Back to home</a>
        </p>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        document.getElementById('forgot-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const msg = document.getElementById('msg');
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.email === email);

            msg.classList.remove('hidden');
            if (user) {
                // Simulated reset - in real app would send email
                msg.className = 'text-sm text-emerald-600 bg-emerald-50 dark:bg-emerald-900/20 px-4 py-2.5 rounded-lg';
                msg.innerHTML = `<strong>Reset link sent!</strong><br>For this demo, your password is: <code class="bg-emerald-100 dark:bg-emerald-800 px-1 rounded">${user.password}</code><br><span class="text-xs">(In a real cloud app, a secure reset email would be sent.)</span>`;
            } else {
                msg.className = 'text-sm text-amber-600 bg-amber-50 dark:bg-amber-900/20 px-4 py-2.5 rounded-lg';
                msg.textContent = 'If an account exists with this email, a reset link has been sent. Please check your inbox.';
            }
        });
    </script>
</body>
</html>
